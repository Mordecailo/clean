<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean</title>
<style>
  :root {
    --bg: #eef4f8;
    --fg: #1d1d1f;
    --muted: #5a6570;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: var(--bg);
    background-image: url('cleanBG.png');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    color: var(--fg);
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .label {
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-shadow: 0 1px 10px rgba(255, 255, 255, .6);
  }
  .value {
    font-size: clamp(120px, 34vw, 460px);
    line-height: .88;
    font-weight: 700;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 24px rgba(255, 255, 255, .55);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .value.is-date {
    font-size: clamp(30px, 8vw, 120px);
    letter-spacing: -.02em;
    line-height: 1.05;
  }
</style>
</head>
<body>
  <div class="label" id="label">Clean</div>
  <div class="value" id="value" role="button" tabindex="0">…</div>

  <script>
    /* =======================================================
       ИЗМЕНИТЕ ТОЧКУ ОТСЧЁТА ЗДЕСЬ (формат ГГГГ-ММ-ДД)
       ======================================================= */
const START_DATE = '2026-10-10';

    function parseLocal(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    const START = parseLocal(START_DATE);
    const DATE_TEXT = START.toLocaleDateString('ru-RU', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    const valueEl = document.getElementById('value');
    const labelEl = document.getElementById('label');
    let showDate = false;

    function daysSince() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((today - START) / 86400000);
    }

    function render() {
      if (showDate) {
        labelEl.textContent = 'Since';
        valueEl.textContent = DATE_TEXT;
        valueEl.classList.add('is-date');
        valueEl.setAttribute('aria-label', 'Показать количество дней');
      } else {
        labelEl.textContent = 'Clean';
        const days = daysSince();
        valueEl.textContent = days < 0 ? '—' : String(days);
        valueEl.classList.remove('is-date');
        valueEl.setAttribute('aria-label', 'Показать дату отсчёта');
      }
    }

    function toggle() {
      showDate = !showDate;
      render();
    }

    valueEl.addEventListener('click', toggle);
    valueEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle();
      }
    });

    function scheduleMidnightRefresh() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
      setTimeout(function () { render(); scheduleMidnightRefresh(); }, next - now);
    }

    render();
    scheduleMidnightRefresh();
  </script>
</body>
</html>
